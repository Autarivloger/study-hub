name: Python Week 52 capstone acceptance
on:
  push:
    paths: ['docs/python-week52/**', '.github/workflows/python-week52.yml']
  pull_request:
    paths: ['docs/python-week52/**', '.github/workflows/python-week52.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: week52-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capstone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: docs/python-week52
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: docs/python-week52/requirements*.txt
      - name: Install development environment
        run: python -m pip install -r requirements-dev.txt
      - name: Verify behavior, actual HTTP and installed artifact
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python smoke.py --output artifacts/verification.json
          python release_check.py --output artifacts/release.json
