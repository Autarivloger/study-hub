name: Python Week 51 package and release rehearsal
on:
  push:
    paths: ['docs/python-week51/**', '.github/workflows/python-week51.yml']
  pull_request:
    paths: ['docs/python-week51/**', '.github/workflows/python-week51.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: week51-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: docs/python-week51
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: docs/python-week51/requirements*.txt
      - name: Install development tools and editable package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate behavior and distribution
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python bench.py --output artifacts/benchmark.json
          python verify_release.py --output artifacts/release.json
