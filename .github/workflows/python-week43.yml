name: Python Week 43 containers
on:
  push:
    paths: ['docs/python-week43/**', '.github/workflows/python-week43.yml']
  pull_request:
    paths: ['docs/python-week43/**', '.github/workflows/python-week43.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: week43-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/python-week43
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/python-week43/requirements*.txt
      - name: Install pinned practice tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests and lint
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run real dashboard browser workflows
        run: node browser_smoke.cjs
      - name: Create isolated throwaway lab secrets
        run: python ops.py init-secrets
      - name: Validate Compose and build actual image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start PostgreSQL, migration job and API
        run: docker compose up -d --wait --wait-timeout 120 api
      - name: Verify actual containers, persistence and restore
        run: python container_smoke.py
      - name: Stop this runner's throwaway lab and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
