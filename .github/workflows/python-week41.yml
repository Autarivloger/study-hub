name: Python Week 41 quality

on:
  push:
    paths:
      - 'docs/python-week41/**'
      - '.github/workflows/python-week41.yml'
  pull_request:
    paths:
      - 'docs/python-week41/**'
      - '.github/workflows/python-week41.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week41-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: docs/python-week41
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            docs/python-week41/requirements.txt
            docs/python-week41/requirements-dev.txt
      - name: Install pinned practice dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run isolated offline tests
        run: python -m pytest -q -p pytest_cov --cov=orm_api --cov-report=term-missing --cov-fail-under=75
