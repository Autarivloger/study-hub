{% extends "base.html" %}
{% block title %}Enter demo{% endblock %}
{% block content %}
<p class="eyebrow">SESSION GATE PRACTICE</p><h1>Open the demo space</h1>
<p>This is not verified identity or a real account. Use a fictional name; no password is requested.</p>
<form method="post" action="{{ url_for('enter') }}" class="card stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="display_name">Fictional display name</label>
  <input id="display_name" name="display_name" value="{{ name }}" minlength="2" maxlength="40" required autocomplete="off">
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <button>Enter the practice planner</button>
</form>
{% endblock %}
