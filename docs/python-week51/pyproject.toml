[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyhub51-records"
version = "0.1.0"
description = "An original teaching library for validated study records"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
studyhub-records = "studyhub_records.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
