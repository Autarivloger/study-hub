[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
markers = [
  "unit: fast pure/configuration/HTTP-mock checks",
  "integration: real local API and temporary database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["orm_api"]

[tool.coverage.report]
show_missing = true
